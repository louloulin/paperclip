[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "paperclip-sdk"
version = "0.1.0"
description = "Official Python SDK for the Paperclip AI Company Control Plane API"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [
    { name = "Paperclip Team", email = "team@paperclip.ai" }
]
keywords = ["paperclip", "ai", "agent", "sdk", "api"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.optional-dependencies]
async = ["httpx>=0.25.0"]

[project.urls]
Homepage = "https://github.com/paperclipai/paperclip"
Documentation = "https://docs.paperclip.ai"
Repository = "https://github.com/paperclipai/paperclip"

[tool.hatch.build.targets.sdist]
include = ["src"]

[tool.hatch.build.targets.wheel]
packages = ["src/paperclip"]
